<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>35dnd Public</title>
  <style>
    /* Minimal styles to preserve layout used by app.js */
    html,body { height:100%; margin:0; font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif; }
    .topbar { height:64px; display:flex; align-items:center; gap:12px; padding:8px 12px; background:#f5f5f5; box-shadow:0 1px 0 rgba(0,0,0,0.06); }
    #viewport { position:relative; overflow:auto; background:#fff; }
    #world { transform-origin:0 0; position:relative; }
    #app { position:relative; background:transparent; min-width:320px; }
    canvas.ink { display:block; position:absolute; left:0; top:0; z-index:30; }
    .controls { display:flex; gap:8px; padding:8px; }
    .panel { padding:12px; background:#fff; border-radius:6px; box-shadow:0 1px 2px rgba(0,0,0,0.04); margin:12px; }
    .hint { color:#666; font-size:13px; margin-top:6px; }
    .grid { display:flex; gap:12px; flex-wrap:wrap; }
    .ability-breakdown-grid { display:grid; grid-template-columns: repeat(7, 1fr); gap:6px; align-items:center; }
    .val { padding:4px; }
    .hdr { font-weight:600; }
    .table { width:100%; border-collapse:collapse; }
    .table th, .table td { border:1px solid #eee; padding:6px; text-align:left; }
  </style>
</head>
<body>
  <div class="topbar">
    <div style="flex:1"><strong>35dnd</strong></div>
    <div class="controls">
      <button id="penToggle">Pen: OFF</button>
      <button id="eraser">Eraser</button>
      <button id="undo">Undo</button>
      <button id="clearInk">Clear</button>
      <button id="zoomOut">-</button>
      <button id="zoomIn">+</button>
      <button id="zoomReset">Reset</button>
    </div>
  </div>

  <div id="viewport" style="height:calc(100vh - 64px);">
    <div id="world">
      <div id="app">
        <!-- App content will be rendered here by app.js -->
        <!-- The ink canvas must be a direct child of #app -->
        <canvas id="inkWorld" class="ink"></canvas>
      </div>
    </div>
  </div>

  <div style="padding:12px;">
    <div style="margin-bottom:8px;">
      <input id="gsUrl" placeholder="Google Sheets URL" style="width:60%" />
      <button id="loadGs">Load</button>
      <button id="fillGs">Auto-fill</button>
    </div>
    <div id="status" class="hint">Ready</div>
    <div style="height:8px; background:#eee; margin-top:8px;">
      <div id="progressBar" style="height:8px; width:0%; background:#4caf50;"></div>
    </div>
  </div>

  <!-- app.js should be loaded after DOM; use defer to ensure elements exist -->
  <script src="app.js" defer></script>
</body>
</html>
