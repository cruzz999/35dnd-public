<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DnD 3.5 Ink Sheet (MVP)</title>
  <link rel="stylesheet" href="/35dnd/styles.css?v=20260528b" />
  <!-- SheetJS from CDN (works offline too if you download it locally later) -->
  <script src="/35dnd/xlsx.full.min.js"></script>
</head>

<body>
  <header class="topbar">
    <div class="left">
      <input id="file" type="file" accept=".xlsx" />
      <input id="gsUrl" type="text"
       placeholder="Paste Google Sheets URL"
       value="https://docs.google.com/spreadsheets/d/1P_Vslp-rxiTcntUZVLR2BjJrdeQqdWfPLeigs2Gnx_U/edit?usp=sharing"
       style="width:420px; max-width:100%;">
      <button id="loadGs">Load Sheet</button>
      <span id="status">Load your XLSX to begin.</span>
      <div class="progress">
        <div id="progressBar"></div>
      </div>
    </div>

    <div class="right">
      <button id="viewGeneral">General</button>
      <button id="viewSpells">Spells</button>
      <button id="viewSlots">Slots</button>
      <button id="viewSkills">Skills</button>

      <span class="sep"></span>

      <button id="zoomOut">−</button>
      <button id="zoomReset">Reset</button>
      <button id="zoomIn">+</button>

      <span class="sep"></span>

      <button id="penToggle">Pen: OFF</button>
      <button id="eraser">Eraser</button>
      <button id="undo">Undo</button>
      <button id="clearInk">Clear</button>
      <div class="line-width" title="Line width">
  <label for="lineWidthRange">Line</label>
  <input id="lineWidthRange" type="range" min="0.5" max="24" step="0.5" value="2" />
  <input id="lineWidthNumber" type="number" min="0.5" max="24" step="0.5" value="2" />
</div>
    </div>
  </header>

  <!-- Paper viewport (no page scroll). Everything is panned/zoomed inside this. -->
  <div id="viewport">
    <div id="world">
      <div id="app" class="app"></div>
      <canvas id="inkWorld"></canvas>
    </div>
  </div>
   <script src="/35dnd/slotCalculator.js"></script>
  <script src="/35dnd/app.js?v=20260528b"></script>
</body>
</html>
