<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>35dnd</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="viewport" class="viewport">
    <div id="world" class="world">
      <div id="app" class="app"></div>
    </div>
    <!-- Ink canvas must exist with id "inkWorld" and be a sibling of #world so transforms match -->
    <canvas id="inkWorld" class="ink-canvas" width="2000" height="2000" aria-hidden="true"></canvas>
  </div>

  <!-- Controls (minimal; your app.js wires these by id) -->
  <input id="file" type="file" style="display:none" />
  <div id="controls" style="display:none">
    <button id="viewGeneral">General</button>
    <button id="viewSpells">Spells</button>
    <button id="viewSlots">Slots</button>
    <button id="viewSkills">Skills</button>
    <button id="penToggle">Pen: OFF</button>
    <button id="eraser">Eraser</button>
    <button id="undo">Undo</button>
    <button id="clearInk">Clear</button>
    <input id="gsUrl" type="text" />
    <button id="loadGs">Load</button>
    <div id="status"></div>
    <div id="progressBarWrap"><div id="progressBar"></div></div>
  </div>

  <!-- XLSX library (if used) -->
  <script src="./xlsx.full.min.js"></script>

  <!-- Load app.js as a module so dynamic import and top-level module semantics are consistent -->
  <script type="module" src="./app.js"></script>
</body>
</html>
