<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>35dnd</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- Top bar / controls (visible) -->
  <header id="topbar" class="topbar">
    <div class="topbar-left">
      <button id="viewGeneral">General</button>
      <button id="viewSpells">Spells</button>
      <button id="viewSlots">Slots</button>
      <button id="viewSkills">Skills</button>
    </div>
    <div class="topbar-center">
      <input id="gsUrl" type="text" placeholder="Paste Google Sheets URL here" />
      <button id="loadGs">Load Sheet</button>
      <label class="file-label">
        <input id="file" type="file" />
        Upload XLSX
      </label>
    </div>
    <div class="topbar-right">
      <button id="penToggle">Pen: OFF</button>
      <button id="eraser">Eraser</button>
      <button id="undo">Undo</button>
      <button id="clearInk">Clear</button>
      <div id="status" class="status"></div>
    </div>
  </header>

  <!-- Viewport and world -->
  <div id="viewport" class="viewport">
    <div id="world" class="world">
      <div id="app" class="app"></div>
    </div>

    <!-- Ink canvas: default does NOT receive pointer events (so UI is clickable).
         The app's Pen toggle will enable pointer events when drawing. -->
    <canvas id="inkWorld" class="ink-canvas" width="2000" height="2000" aria-hidden="true"></canvas>
  </div>

  <!-- XLSX library (if used) -->
  <script src="./xlsx.full.min.js"></script>

  <!-- Load app.js as a module -->
  <script type="module" src="./app.js"></script>
</body>
</html>
