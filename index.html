<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="/35dnd/styles.css">
  <title>DnD 3.5 Ink Sheet (MVP)</title>


</head>
<body>
  <header class="topbar" role="banner">
    <div class="left">
      <input id="file" type="file" accept=".xlsx" />
      <input id="gsUrl" type="text" placeholder="Paste Google Sheets URL" style="width:420px; max-width:40vw;" />
      <button id="loadGs">Load Sheet</button>
      <span id="status">Load your XLSX to begin.</span>
      <div class="progress" aria-hidden="true"><div id="progressBar"></div></div>
    </div>

    <div class="right">
      <button id="viewGeneral">General</button>
      <button id="viewSpells">Spells</button>
      <button id="viewSlots">Slots</button>
      <button id="viewSkills">Skills</button>
      <span class="sep" aria-hidden="true"></span>
      <button id="zoomOut">−</button>
      <button id="zoomReset">Reset</button>
      <button id="zoomIn">+</button>
      <span class="sep" aria-hidden="true"></span>
      <button id="penToggle">Pen: OFF</button>
      <button id="eraser">Eraser</button>
      <button id="undo">Undo</button>
      <button id="clearInk">Clear</button>
    </div>
  </header>

  <div id="viewport" role="main" aria-label="Paper viewport">
    <div id="world" aria-hidden="false">
      <div id="app" class="app">
        <!-- Example sheet content (keeps original structure hooks intact).
             Your app.js will replace or populate this with the real sheet markup. -->
        <div class="sheet" id="characterSheet">
          <h1>Character Sheet (placeholder)</h1>
          <div class="row">
            <div class="col">
              <label for="charName">Name</label>
              <input id="charName" name="charName" type="text" value="(load a sheet)" />
            </div>
            <div class="col">
              <label for="charClass">Class / Level</label>
              <input id="charClass" name="charClass" type="text" value="" />
            </div>
            <div class="col">
              <label for="charRace">Race</label>
              <input id="charRace" name="charRace" type="text" value="" />
            </div>
          </div>
        </div>
      </div>

      <canvas id="inkWorld" width="1600" height="1200"></canvas>
    </div>
  </div>

  <!-- SheetJS (used by app.js) -->
  <script src="/35dnd/xlsx.full.min.js"></script>

  <!-- Main app script (must match the repo path/version you use) -->
  <script type="module" src="/35dnd/app.js"></script>

  <script>
    // Small compatibility glue: ensure toolbar buttons exist and are focusable.
    // This does not replace app.js handlers; it only prevents missing-element errors.
    (function ensureElements() {
      const ids = ["file","gsUrl","loadGs","status","progressBar","viewGeneral","viewSpells","viewSlots","viewSkills","zoomOut","zoomReset","zoomIn","penToggle","eraser","undo","clearInk","viewport","world","app","inkWorld"];
      for (const id of ids) if (!document.getElementById(id)) {
        const el = document.createElement('div'); el.id = id; el.style.display = 'none'; document.body.appendChild(el);
      }
    })();
  </script>
</body>
</html>
