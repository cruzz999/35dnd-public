<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>35 DnD Ink Sheet</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="topbar">
    <div class="brand">35 DnD Ink Sheet</div>
    <div class="controls">
      <input id="gsUrl" class="input" placeholder="Paste Google Sheets URL here" />
      <button id="loadGs" class="btn">Load Google Sheets</button>
      <button id="viewGeneral" class="btn">General</button>
      <button id="viewSpells" class="btn">Spells</button>
      <button id="viewSlots" class="btn">Slots</button>
      <button id="viewSkills" class="btn">Skills</button>
      <button id="zoomOut" class="btn">−</button>
      <button id="zoomIn" class="btn">+</button>
      <button id="zoomReset" class="btn">Reset</button>
      <button id="addWriteSpace">Add Space</button>
      <button id="penToggle" class="btn">Pen: OFF</button>
      <button id="eraser" class="btn">Eraser</button>
      <button id="undo" class="btn">Undo</button>
      <button id="clearInk" class="btn">Clear</button>
      <!-- Add these near the other controls in the topbar -->
<!-- Pen width control (replace existing penWidth control) -->
<label style="display:flex;align-items:center;gap:6px;">
  <span style="font-size:13px;">Width</span>
  <input id="penWidth" type="range" min="0.5" max="24" step="0.25" value="0.5" style="width:120px;">
  <span id="penWidthLabel" style="min-width:36px;text-align:center;font-size:13px;">0.5</span>
</label>

<!-- Greyscale control (unchanged) -->
<label style="display:flex;align-items:center;gap:6px;">
  <span style="font-size:13px;">Grey</span>
  <input id="penGrey" type="range" min="0" max="100" value="0" style="width:120px;">
  <span id="penGreyLabel" style="min-width:36px;text-align:center;font-size:13px;">#000</span>
</label>

<!-- Google Sheets input (auto-populated) -->
<input id="gsUrl" placeholder="Google Sheets URL"
  value="https://docs.google.com/spreadsheets/d/1P_Vslp-rxiTcntUZVLR2BjJrdeQqdWfPLeigs2Gnx_U/edit?usp=sharing"
  style="width:60%" />
    </div>








  </div>

  <div id="viewport" class="viewport">
    <div id="world" class="world">
      <div id="app" class="app"></div>
      <canvas id="inkWorld" class="ink"></canvas>
    </div>
  </div>

  <div class="statusbar">
    <div id="status" class="status">Ready</div>
    <div class="progress">
      <div id="progressBar" class="progressBar"></div>
    </div>
  </div>

  <template id="hint-template">
    <div class="hint">Use the Google Sheets URL above to load your character sheet. XLSX uploads are disabled.</div>
  </template>

  <!-- Optional: keep a disabled file input if you want a visual placeholder -->
  <div class="file-ui">
    <label class="file-label">XLSX uploads disabled</label>
    <input id="file" type="file" accept=".xlsx" style="display:none" />
  </div>

  <!-- gs_ingest must be loaded before app.js -->
  <script src="gs_ingest.js"></script>
  <script src="app.js"></script>
