<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DnD Ink Sheet</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="topbar">
    <div class="left">
      <button id="viewGeneral" class="btn">General</button>
      <button id="viewSpells" class="btn">Spells</button>
      <button id="viewSlots" class="btn">Slots</button>
      <button id="viewSkills" class="btn">Skills</button>
    </div>

    <div class="controls">
      <button id="zoomOut" class="btn">−</button>
      <button id="zoomReset" class="btn">Reset</button>
      <button id="zoomIn" class="btn">+</button>

      <button id="penToggle" class="btn">Pen: OFF</button>
      <button id="eraser" class="btn">Eraser</button>
      <button id="undo" class="btn">Undo</button>
      <button id="clearInk" class="btn">Clear Ink</button>

      <label class="small">
        Width
        <input id="penWidth" type="range" min="0.25" max="4" step="0.25" value="0.5">
        <span id="penWidthLabel">0.5</span>
      </label>

      <label class="small">
        Grey
        <input id="penGrey" type="range" min="0" max="100" step="1" value="0">
        <span id="penGreyLabel">#000000</span>
      </label>
    </div>

    <div class="right">
      <input id="gsUrl" class="gsurl" placeholder="Google Sheets URL">
      <button id="fillGs" class="btn">Fill</button>
      <button id="loadGs" class="btn">Load</button>
      <input id="file" type="file" style="display:none;">
    </div>
  </div>

  <!-- viewport contains the world (paper) which is transformed for pan/zoom -->
  <div id="viewport" class="viewport">
    <div id="world" class="world">
      <!-- app content is rendered into #app -->
      <div id="app" class="app"></div>
    </div>
  </div>

  <!-- Canvas is created in DOM and will be moved into a top-level overlay by app.js -->
  <canvas id="inkWorld" class="ink" aria-hidden="true"></canvas>

  <!-- Scripts -->
  <!-- gs_ingest.js is expected to be present in the project and loaded before app.js -->
  <script src="gs_ingest.js"></script>
  <script src="app.js"></script>
</body>
</html>
